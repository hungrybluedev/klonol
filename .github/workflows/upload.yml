name: Upload artifacts

on:
  push:
    tags:
      - "v*" # matches v1.0.1, v1.2, v2, etc

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu", "macos", "windows"]
    runs-on: ${{ matrix.os }}-latest

    steps:
      # Must precede setup-v, which reads .v-version from the working tree.
      - name: Checkout ${{ github.event.repository.name }}
        uses: actions/checkout@v7

      - name: Setup V (pinned via .v-version)
        uses: vlang/setup-v@v1.7
        with:
          version-file: .v-version

      - name: Report V version
        run: v version

      # build.vsh runs `v fmt -verify .` itself, so no separate step is needed.
      - name: Build ${{ github.event.repository.name }}
        run: v run build.vsh

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: klonol-${{ matrix.os }}
          path: bin
          retention-days: 15

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8

      - name: Zip artifacts
        run: |
          for os in ubuntu macos windows; do
            (cd klonol-$os && zip -r ../klonol-$os.zip .)
          done

      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: klonol-*.zip
