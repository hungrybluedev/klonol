name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * 4"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Builds against the V commit pinned in .v-version.
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, macos]
        experimental: [false]
        include:
          # Not a merge gate yet. Move into the matrix above once reliably green.
          - os: windows
            experimental: true
    runs-on: ${{ matrix.os }}-latest
    continue-on-error: ${{ matrix.experimental }}

    steps:
      - name: Checkout ${{ github.event.repository.name }}
        uses: actions/checkout@v6

      - name: Setup V (pinned via .v-version)
        uses: vlang/setup-v@v1.7
        with:
          version-file: .v-version

      - name: Report V version
        run: v version

      - name: Check if code is formatted
        run: v fmt -verify .

      - name: Run tests
        run: v test .

      - name: Build ${{ github.event.repository.name }}
        run: v . -o klonol-smoke

      - name: Smoke-test the built executable
        shell: bash
        run: |
          bin=./klonol-smoke
          [ -f "${bin}.exe" ] && bin="${bin}.exe"
          "$bin" --version
          "$bin" -p mock -a list

  # Early warning that V master broke us. Never a merge gate; when it goes
  # red, investigate and then bump .v-version deliberately.
  canary:
    name: V master canary
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout ${{ github.event.repository.name }}
        uses: actions/checkout@v6

      - name: Setup V (latest master)
        uses: vlang/setup-v@v1.7
        with:
          version: master
          check-latest: true

      - name: Report V version
        run: v version

      - name: Check if code is formatted
        run: v fmt -verify .

      - name: Run tests
        run: v test .

      - name: Build ${{ github.event.repository.name }}
        run: v .
